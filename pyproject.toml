[project]
name = "library"
version = "0.1.0"
description = "Library Management System REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "email-validator>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "ruff==0.8.2",
    "httpx2==2.16.2",
    "bandit>=1.9.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.bandit]
targets = ["app"]
severity = "low"    # report all severities
confidence = "low"  # report all confidence levels
exclude_dirs = ["tests", ".venv"]
